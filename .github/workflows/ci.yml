name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tauri-client:
    name: Tauri frontend and Rust gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Agent and Tauri frontend dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --ignore-scripts --no-audit --no-fund

      - name: Verify generated IPC types
        run: npm run ipc:check

      - name: Tauri frontend tests and build
        working-directory: app
        run: |
          npm test
          npm run build

      - name: Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust lint
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --all-targets --all-features

  agent-tests:
    name: Agent tests (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-dotnet@v4
        if: matrix.rid == 'win-x64'
        with:
          global-json-file: desktop/global.json

      - name: Install Agent dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Publish chrome-launcher broker
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          dotnet publish tools/chrome-launcher/ChromeLauncher.csproj `
            -c Release -r win-x64 -o artifacts/chrome-launcher
          "GPT_ACCOUNT_KEEPER_CHROME_LAUNCHER=$env:GITHUB_WORKSPACE/artifacts/chrome-launcher/chrome-launcher.exe" >> $env:GITHUB_ENV

      - name: Node tests
        run: npm test
