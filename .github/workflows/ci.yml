name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-native-aot:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Node tests
        run: npm test

      - name: Avalonia build (warnings are errors)
        run: dotnet build desktop/GptAccountKeeper.Desktop.sln -c Release

      - name: Native desktop tests
        run: dotnet test desktop/tests/GptAccountKeeper.Desktop.Tests/GptAccountKeeper.Desktop.Tests.csproj -c Release --no-build

      - name: NativeAOT publish gate
        run: >-
          dotnet publish
          desktop/src/GptAccountKeeper.Desktop/GptAccountKeeper.Desktop.csproj
          -c Release
          -r win-x64
          -o artifacts/desktop-win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: native-aot-win-x64
          path: artifacts/desktop-win-x64
          if-no-files-found: error

  # Compile-only gate for the platforms that are not released yet. NativeAOT
  # cannot cross-compile (it invokes the target platform's native linker), so
  # each RID has to build on its own runner. This job proves the platform
  # guards in AppPaths/AgentEndpoint/StartupRegistrationService actually
  # compile before any work is done on multi-platform packaging.
  desktop-native-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      # Several desktop tests spawn the real Node Agent over the platform's IPC
      # transport, so this job needs Node and installed dependencies exactly like
      # the Windows job does -- not just the .NET SDK.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json

      # Bounded: a hung apt mirror otherwise holds the runner for hours instead
      # of failing, which is what happened on the first multi-platform run.
      - name: Install NativeAOT prerequisites
        if: matrix.rid == 'linux-x64'
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Avalonia build (warnings are errors)
        run: >-
          dotnet build
          desktop/src/GptAccountKeeper.Desktop/GptAccountKeeper.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}

      # Ahead of the tests on purpose: whether NativeAOT works on this RID is the
      # question that decides the packaging approach, and a test failure for an
      # unrelated reason would otherwise skip this step and leave it unanswered.
      - name: NativeAOT publish gate
        run: >-
          dotnet publish
          desktop/src/GptAccountKeeper.Desktop/GptAccountKeeper.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          -o artifacts/desktop-${{ matrix.rid }}

      - name: Native desktop tests
        run: dotnet test desktop/tests/GptAccountKeeper.Desktop.Tests/GptAccountKeeper.Desktop.Tests.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: native-aot-${{ matrix.rid }}
          path: artifacts/desktop-${{ matrix.rid }}
          if-no-files-found: error

  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The Agent branches on process.platform for endpoints, instance locks,
      # profile paths and the mihomo locator. Those branches are only exercised
      # when the suite actually runs on the platform in question.
      - name: Node tests
        run: npm test
