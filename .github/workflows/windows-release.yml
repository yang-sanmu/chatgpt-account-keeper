name: Cross-platform Tauri release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tauri release version (without v)
        required: true
        type: string
      release_notes:
        description: User-facing Markdown update summary
        required: true
        type: string
      publish_draft:
        description: Create the shared GitHub draft after all signing gates pass
        required: true
        default: false
        type: boolean
      n_minus_one_verified:
        description: Candidate install and data-retention checks are complete
        required: true
        default: false
        type: boolean
      publish_unsigned_v0_2_3:
        description: One-time public v0.2.3 release without platform code signing or installed-update attestation
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release metadata and signing gate
    runs-on: ubuntu-22.04
    env:
      GAK_RELEASE_NOTES: ${{ inputs.release_notes }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify the independent Tauri version line
        run: node scripts/verify-release-version.mjs '${{ inputs.version }}'

      - name: Validate the one-time unsigned v0.2.3 request
        if: inputs.publish_unsigned_v0_2_3 == true
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" != '0.2.3' ]]; then
            echo 'The unsigned public-release exception is permanently restricted to v0.2.3.' >&2
            exit 1
          fi
          if [[ '${{ inputs.publish_draft }}' == true || '${{ inputs.n_minus_one_verified }}' == true ]]; then
            echo 'The v0.2.3 exception must not be combined with the normal Draft or installed-update attestations.' >&2
            exit 1
          fi

      - name: Validate release notes and updater signing configuration
        shell: bash
        run: |
          node scripts/write-release-notes.mjs artifacts/release-notes.md
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app/src-tauri/tauri.conf.json','utf8'));const k=c.plugins?.updater?.pubkey;if(!k||/PLACEHOLDER/i.test(k)){throw new Error('Replace the M5 updater public-key placeholder before building a release')}"
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'TAURI_SIGNING_PRIVATE_KEY is required to create updater artifacts.' >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for the encrypted updater key.' >&2
            exit 1
          fi

  build:
    name: Tauri ${{ matrix.rid }} candidate
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            rid: osx-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            rid: osx-x64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: ubuntu-22.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      LINUX_MINISIGN_SECRET_KEY_BASE64: ${{ secrets.LINUX_MINISIGN_SECRET_KEY_BASE64 }}
      LINUX_MINISIGN_PASSWORD: ${{ secrets.LINUX_MINISIGN_PASSWORD }}
      LINUX_MINISIGN_PUBLIC_KEY: ${{ secrets.LINUX_MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-dotnet@v4
        if: matrix.rid == 'win-x64'
        with:
          global-json-file: desktop/global.json

      - name: Install Linux Tauri bundler prerequisites
        if: matrix.rid == 'linux-x64'
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential curl file libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf rpm xdg-utils

      - name: Install Agent and Tauri frontend dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --ignore-scripts --no-audit --no-fund

      - name: Download and verify pinned private runtimes
        run: node scripts/download-release-runtime.mjs --rid '${{ matrix.rid }}' --output artifacts/runtime

      - name: Publish chrome-launcher broker
        if: matrix.rid == 'win-x64'
        run: dotnet publish tools/chrome-launcher/ChromeLauncher.csproj -c Release -r win-x64 -o artifacts/chrome-launcher

      - name: Stage Tauri resources, generate Agent SBOM and smoke the private Agent
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          node_name=node
          mihomo_name=mihomo
          if [[ "$RID" == win-x64 ]]; then
            node_name=node.exe
            mihomo_name=mihomo.exe
            node scripts/stage-release.mjs --version "$VERSION" --rid "$RID" --node "artifacts/runtime/node/$node_name" --node-license artifacts/runtime/node/LICENSE --mihomo "artifacts/runtime/mihomo/$mihomo_name" --mihomo-license artifacts/runtime/mihomo/LICENSE --chrome-launcher artifacts/chrome-launcher/chrome-launcher.exe --output app/src-tauri/release-resources
          else
            node scripts/stage-release.mjs --version "$VERSION" --rid "$RID" --node "artifacts/runtime/node/$node_name" --node-license artifacts/runtime/node/LICENSE --mihomo "artifacts/runtime/mihomo/$mihomo_name" --mihomo-license artifacts/runtime/mihomo/LICENSE --output app/src-tauri/release-resources
          fi
          npm sbom --prefix app/src-tauri/release-resources/agent --omit=dev --package-lock-only --sbom-format cyclonedx > app/src-tauri/release-resources/licenses/agent.cdx.json
          node scripts/verify-package.mjs app/src-tauri/release-resources "$VERSION" "$RID"
          node scripts/smoke-staged-agent.mjs app/src-tauri/release-resources

      - name: Verify staged Unix binary architecture
        if: matrix.rid != 'win-x64'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          file app/src-tauri/release-resources/agent/runtime/node
          file app/src-tauri/release-resources/agent/bin/mihomo
          case "$RID" in
            osx-arm64)
              file app/src-tauri/release-resources/agent/runtime/node | grep -q arm64
              ;;
            osx-x64)
              file app/src-tauri/release-resources/agent/runtime/node | grep -q x86_64
              ;;
            linux-x64)
              file app/src-tauri/release-resources/agent/runtime/node | grep -Eq 'x86-64|x86_64'
              ;;
          esac

      - name: Configure Windows Authenticode signing
        if: matrix.rid == 'win-x64'
        id: windows_signing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw 'Windows signing secrets must either both be configured or both be absent.'
          }
          if (-not $hasCertificate) {
            '{}' | Set-Content artifacts/platform-signing.conf.json -Encoding utf8
            'signed=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'keeper-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $secure = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure |
            Where-Object HasPrivateKey | Select-Object -First 1
          if ($null -eq $certificate) { throw 'Imported PFX does not contain a private signing key.' }
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content artifacts/platform-signing.conf.json -Encoding utf8
          'signed=true' >> $env:GITHUB_OUTPUT

      - name: Configure Apple signing and notarization
        if: startsWith(matrix.rid, 'osx-')
        id: apple_signing
        shell: bash
        env:
          MACOS_APP_CERTIFICATE_BASE64: ${{ secrets.MACOS_APP_CERTIFICATE_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          APPLE_ACCOUNT_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          values=("$MACOS_APP_CERTIFICATE_BASE64" "$MACOS_P12_PASSWORD" "$MACOS_APP_IDENTITY" "$APPLE_ACCOUNT_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_DEVELOPER_TEAM_ID")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 6 ]]; then
            echo 'All Apple signing and notarization secrets must be configured together.' >&2
            exit 1
          fi
          mkdir -p artifacts
          if [[ "$configured" -eq 6 ]]; then
            printf '{}\n' > artifacts/platform-signing.conf.json
            printf '%s\n' \
              "APPLE_CERTIFICATE=$MACOS_APP_CERTIFICATE_BASE64" \
              "APPLE_CERTIFICATE_PASSWORD=$MACOS_P12_PASSWORD" \
              "APPLE_SIGNING_IDENTITY=$MACOS_APP_IDENTITY" \
              "APPLE_ID=$APPLE_ACCOUNT_ID" \
              "APPLE_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" \
              "APPLE_TEAM_ID=$APPLE_DEVELOPER_TEAM_ID" >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            printf '{"bundle":{"macOS":{"signingIdentity":"-"}}}\n' > artifacts/platform-signing.conf.json
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Linux bundle
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          mkdir -p artifacts
          printf '{}\n' > artifacts/platform-signing.conf.json

      - name: Build Tauri bundles and updater signatures
        working-directory: app
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: npm run tauri:build:release -- --target "$TARGET" --bundles "$BUNDLES" --config ../artifacts/platform-signing.conf.json

      - name: Collect deterministic release assets
        run: >-
          node scripts/collect-tauri-artifacts.mjs
          --bundles app/src-tauri/target
          --version '${{ inputs.version }}'
          --rid '${{ matrix.rid }}'
          --sbom app/src-tauri/release-resources/licenses/agent.cdx.json
          --output artifacts/release-assets

      - name: Verify Authenticode signatures
        if: matrix.rid == 'win-x64' && steps.windows_signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts/release-assets -File -Filter '*-setup.exe')
          $applications = @(Get-ChildItem app/src-tauri/target -Recurse -File -Filter 'keeper-app.exe' |
            Where-Object { $_.FullName -match '[\\/]release[\\/]keeper-app\.exe$' })
          if ($installers.Count -ne 1 -or $applications.Count -ne 1) {
            throw "Expected one NSIS installer and one release application, found $($installers.Count) and $($applications.Count)."
          }
          $installer = $installers[0]
          $application = $applications[0]
          foreach ($file in @($installer, $application)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($file.FullName): $($signature.Status)"
            }
          }
          'Authenticode and timestamp verified.' | Set-Content artifacts/release-assets/SIGNED-win-x64.txt -Encoding utf8

      - name: Mark unsigned Windows inspection candidate
        if: matrix.rid == 'win-x64' && steps.windows_signing.outputs.signed != 'true'
        shell: pwsh
        run: "'Authenticode certificate was not configured.' | Set-Content artifacts/release-assets/UNSIGNED-win-x64.txt -Encoding utf8"

      - name: Verify signed, notarized and stapled Apple bundles
        if: startsWith(matrix.rid, 'osx-') && steps.apple_signing.outputs.signed == 'true'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          app_bundle=$(find app/src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)
          dmg=$(find artifacts/release-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$app_bundle"
          test -n "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          spctl --assess --type execute --verbose=2 "$app_bundle"
          xcrun stapler validate "$app_bundle"
          xcrun stapler validate "$dmg"
          executable=$(find "$app_bundle/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          file "$executable"
          if [[ "$RID" == osx-arm64 ]]; then
            file "$executable" | grep -q arm64
          else
            file "$executable" | grep -q x86_64
          fi
          printf 'Developer ID, notarization and stapling verified.\n' > "artifacts/release-assets/SIGNED-$RID.txt"

      - name: Mark ad-hoc Apple inspection candidate
        if: startsWith(matrix.rid, 'osx-') && steps.apple_signing.outputs.signed != 'true'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: printf 'Developer ID and notarization secrets were not configured.\n' > "artifacts/release-assets/UNSIGNED-$RID.txt"

      - name: Create Linux checksum manifest
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          cd artifacts/release-assets
          sha256sum *.AppImage *.AppImage.sig *.deb *.rpm > SHA256SUMS.linux-x64.txt

      - name: Detect and apply Linux Minisign
        if: matrix.rid == 'linux-x64'
        id: linux_signing
        shell: bash
        run: |
          values=("$LINUX_MINISIGN_SECRET_KEY_BASE64" "$LINUX_MINISIGN_PASSWORD" "$LINUX_MINISIGN_PUBLIC_KEY")
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 3 ]]; then
            echo 'All Linux Minisign secrets must be configured together.' >&2
            exit 1
          fi
          if [[ "$configured" -eq 0 ]]; then
            printf 'Minisign secrets were not configured.\n' > artifacts/release-assets/UNSIGNED-linux-x64.txt
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          minisign_version=0.12
          minisign_archive="$RUNNER_TEMP/minisign-$minisign_version-linux.tar.gz"
          minisign_bin="$RUNNER_TEMP/minisign-linux/x86_64/minisign"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/jedisct1/minisign/releases/download/$minisign_version/minisign-$minisign_version-linux.tar.gz" \
            --output "$minisign_archive"
          printf '%s  %s\n' '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73' "$minisign_archive" | sha256sum --check -
          tar -xzf "$minisign_archive" -C "$RUNNER_TEMP"
          chmod +x "$minisign_bin"
          key="$RUNNER_TEMP/gpt-account-keeper.minisign.key"
          printf '%s' "$LINUX_MINISIGN_SECRET_KEY_BASE64" | base64 --decode > "$key"
          appimage=$(find artifacts/release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          printf '%s\n' "$LINUX_MINISIGN_PASSWORD" | "$minisign_bin" -S -s "$key" -m "$appimage" -x "$appimage.minisig"
          printf '%s\n' "$LINUX_MINISIGN_PASSWORD" | "$minisign_bin" -S -s "$key" -m artifacts/release-assets/SHA256SUMS.linux-x64.txt -x artifacts/release-assets/SHA256SUMS.linux-x64.txt.minisig
          "$minisign_bin" -V -P "$LINUX_MINISIGN_PUBLIC_KEY" -m "$appimage" -x "$appimage.minisig"
          "$minisign_bin" -V -P "$LINUX_MINISIGN_PUBLIC_KEY" -m artifacts/release-assets/SHA256SUMS.linux-x64.txt -x artifacts/release-assets/SHA256SUMS.linux-x64.txt.minisig
          printf 'untrusted comment: ChatGPT Account Keeper Minisign public key\n%s\n' "$LINUX_MINISIGN_PUBLIC_KEY" > artifacts/release-assets/minisign.pub
          printf 'Minisign signatures verified.\n' > artifacts/release-assets/SIGNED-linux-x64.txt
          rm -f "$key"
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Remove Windows signing material
        if: always() && matrix.rid == 'win-x64'
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'keeper-signing.pfx') -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.rid }}-${{ inputs.version }}
          path: artifacts/release-assets
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate cross-platform Tauri release
    needs: [gate, build]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GAK_RELEASE_NOTES: ${{ inputs.release_notes }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-*-${{ inputs.version }}
          path: artifacts/assets
          merge-multiple: true

      - name: Validate the complete platform set
        shell: bash
        run: |
          root=artifacts/assets
          test -s "$root/ChatGPT-Account-Keeper_${VERSION}_windows_x86_64-setup.exe"
          test -s "$root/ChatGPT-Account-Keeper_${VERSION}_windows_x86_64-setup.exe.sig"
          for arch in aarch64 x86_64; do
            test -s "$root/ChatGPT-Account-Keeper_${VERSION}_darwin_$arch.dmg"
            test -s "$root/ChatGPT-Account-Keeper_${VERSION}_darwin_$arch.app.tar.gz"
            test -s "$root/ChatGPT-Account-Keeper_${VERSION}_darwin_$arch.app.tar.gz.sig"
          done
          test -s "$root/ChatGPT-Account-Keeper_${VERSION}_linux_x86_64.AppImage"
          test -s "$root/ChatGPT-Account-Keeper_${VERSION}_linux_x86_64.AppImage.sig"
          test -s "$root/ChatGPT-Account-Keeper_${VERSION}_linux_x86_64.deb"
          test -s "$root/ChatGPT-Account-Keeper_${VERSION}_linux_x86_64.rpm"
          test "$(find "$root" -maxdepth 1 -type f -name '*-agent.cdx.json' | wc -l | tr -d ' ')" = 4

      - name: Create source archives and latest.json
        shell: bash
        run: |
          node scripts/write-release-notes.mjs artifacts/release-notes.md
          if [[ '${{ inputs.publish_unsigned_v0_2_3 }}' == true ]]; then
            printf '\n> **平台代码签名提示：** 此版本保留 Tauri updater 签名，但未进行 Windows Authenticode、Apple Developer ID/公证或 Linux Minisign 签名；操作系统可能显示未知发布者或安全警告。\n' >> artifacts/release-notes.md
          fi
          git archive --format=zip --prefix="chatgpt-account-keeper-$VERSION/" --output="artifacts/assets/chatgpt-account-keeper-$VERSION-source.zip" HEAD
          mihomo_version=$(node -p "require('./build/runtime-versions.json').mihomo.version")
          curl --fail --location --retry 3 "https://github.com/MetaCubeX/mihomo/archive/refs/tags/v$mihomo_version.zip" --output "artifacts/assets/mihomo-v$mihomo_version-source.zip"
          node scripts/write-latest-json.mjs --version "$VERSION" --notes-file artifacts/release-notes.md --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" --windows "artifacts/assets/ChatGPT-Account-Keeper_${VERSION}_windows_x86_64-setup.exe" --darwin-arm64 "artifacts/assets/ChatGPT-Account-Keeper_${VERSION}_darwin_aarch64.app.tar.gz" --darwin-x64 "artifacts/assets/ChatGPT-Account-Keeper_${VERSION}_darwin_x86_64.app.tar.gz" --linux-appimage "artifacts/assets/ChatGPT-Account-Keeper_${VERSION}_linux_x86_64.AppImage" --output artifacts/assets/latest.json
          (
            cd artifacts/assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.release.txt' ! -name 'SIGNED-*.txt' ! -name 'UNSIGNED-*.txt' -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum
          ) > artifacts/assets/SHA256SUMS.release.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Account-Keeper-all-${{ inputs.version }}
          path: artifacts/assets
          if-no-files-found: error
          retention-days: 14

      - name: Require human and platform signing gates before Draft
        if: inputs.publish_draft == true && inputs.publish_unsigned_v0_2_3 != true
        shell: bash
        run: |
          if [[ '${{ inputs.n_minus_one_verified }}' != true ]]; then
            echo 'Draft creation requires the N-1 to N attestation.' >&2
            exit 1
          fi
          if find artifacts/assets -maxdepth 1 -type f -name 'UNSIGNED-*.txt' -print -quit | grep -q .; then
            echo 'A Draft cannot be created from unsigned or unnotarized candidates:' >&2
            find artifacts/assets -maxdepth 1 -type f -name 'UNSIGNED-*.txt' -print >&2
            exit 1
          fi
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            test -s "artifacts/assets/SIGNED-$rid.txt"
          done

      - name: Require explicit unsigned markers for the one-time v0.2.3 release
        if: inputs.publish_unsigned_v0_2_3 == true
        shell: bash
        run: |
          test "$VERSION" = '0.2.3'
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            test -s "artifacts/assets/UNSIGNED-$rid.txt"
          done

      - name: Create the single GitHub Draft or one-time public Release
        if: inputs.publish_draft == true || inputs.publish_unsigned_v0_2_3 == true
        shell: bash
        run: |
          mapfile -d '' assets < <(
            find artifacts/assets -maxdepth 1 -type f ! -name 'SIGNED-*.txt' ! -name 'UNSIGNED-*.txt' -print0 | sort -z
          )
          release_visibility=(--draft)
          if [[ '${{ inputs.publish_unsigned_v0_2_3 }}' == true ]]; then
            release_visibility=(--latest)
          fi
          gh release create "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChatGPT Account Keeper $VERSION" --notes-file artifacts/release-notes.md "${release_visibility[@]}"

      - name: Report candidate-only result
        if: inputs.publish_draft != true && inputs.publish_unsigned_v0_2_3 != true
        run: echo 'Candidate retained as a workflow artifact; no tag or GitHub Release was created.'
