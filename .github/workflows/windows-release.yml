name: Windows release candidate

# Only workflow_dispatch. Both release paths create the tag *after* the package
# has been built and uploaded, so a tag trigger would rebuild a version that is
# already in the win channel -- which VeloPack refuses, failing every release
# with a misleading "equal or greater version" error.
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix
        required: true
        type: string
      publish_draft:
        description: Upload to a GitHub draft Release (leave false to keep the build as a workflow artifact only)
        required: true
        default: false
        type: boolean
      n_minus_one_verified:
        description: Confirm an installed N-1 to N update run completed with Agent restart and data intact
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version must be SemVer: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # Signing is optional. Releases are published unsigned unless a maintainer certificate
      # happens to be configured, so a missing certificate is reported and never fatal.
      - name: Report signing mode
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Host 'No signing certificate configured: building UNSIGNED artifacts.'
            Write-Host 'Windows SmartScreen will warn on first run of the installer and main executable.'
            'signed=false' >> $env:GITHUB_OUTPUT
          } else {
            Write-Host 'Signing certificate present: artifacts will be Authenticode signed.'
            'signed=true' >> $env:GITHUB_OUTPUT
          }
        id: signing

      - name: Install dependencies and test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          dotnet test desktop/GptAccountKeeper.Desktop.sln -c Release

      - name: Publish Avalonia NativeAOT
        run: >-
          dotnet publish
          desktop/src/GptAccountKeeper.Desktop/GptAccountKeeper.Desktop.csproj
          -c Release
          -r win-x64
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/desktop

      - name: Download pinned private runtimes
        shell: pwsh
        run: |
          $versions = Get-Content build/runtime-versions.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory artifacts/downloads -Force | Out-Null

          $nodeArchive = Join-Path artifacts/downloads $versions.node.windowsX64Archive
          Invoke-WebRequest "https://nodejs.org/dist/v$($versions.node.version)/$($versions.node.windowsX64Archive)" -OutFile $nodeArchive
          if ((Get-FileHash $nodeArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $versions.node.windowsX64Sha256) {
            throw 'Node.js archive SHA-256 mismatch'
          }
          Expand-Archive $nodeArchive artifacts/downloads/node

          $mihomoArchive = Join-Path artifacts/downloads $versions.mihomo.windowsX64Archive
          $mihomoUrl = "https://github.com/MetaCubeX/mihomo/releases/download/v$($versions.mihomo.version)/$($versions.mihomo.windowsX64Archive)"
          Invoke-WebRequest $mihomoUrl -OutFile $mihomoArchive
          if ((Get-FileHash $mihomoArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $versions.mihomo.windowsX64Sha256) {
            throw 'mihomo archive SHA-256 mismatch'
          }
          Expand-Archive $mihomoArchive artifacts/downloads/mihomo
          Invoke-WebRequest "https://raw.githubusercontent.com/MetaCubeX/mihomo/v$($versions.mihomo.version)/LICENSE" -OutFile artifacts/downloads/mihomo-LICENSE.txt

      - name: Stage private Agent and verify release contents
        shell: pwsh
        run: |
          $versions = Get-Content build/runtime-versions.json -Raw | ConvertFrom-Json
          $nodeDirectory = Get-ChildItem artifacts/downloads/node -Directory | Select-Object -First 1 -ExpandProperty FullName
          $mihomo = Get-ChildItem artifacts/downloads/mihomo -File -Filter '*.exe' | Select-Object -First 1 -ExpandProperty FullName
          ./scripts/stage-windows-release.ps1 `
            -Version ${{ steps.version.outputs.version }} `
            -DesktopPublishDirectory artifacts/desktop `
            -NodeDirectory $nodeDirectory `
            -MihomoExecutable $mihomo `
            -MihomoLicense artifacts/downloads/mihomo-LICENSE.txt `
            -OutputDirectory artifacts/stage
          npm sbom --prefix artifacts/stage/agent --omit=dev --package-lock-only --sbom-format cyclonedx | Out-File artifacts/stage/licenses/agent.cdx.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Agent SBOM generation failed' }
          node scripts/verify-package.mjs artifacts/stage ${{ steps.version.outputs.version }}
          node scripts/smoke-staged-agent.mjs artifacts/stage

      - name: Install pinned VeloPack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous release for delta generation
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/yang-sanmu/chatgpt-account-keeper
          --token ${{ github.token }}
          --outputDir artifacts/Releases

      - name: Decode signing certificate
        if: env.SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP 'keeper-signing.pfx'),
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))

      - name: Create signed VeloPack package
        if: env.SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'keeper-signing.pfx'
          $signParams = "/td sha256 /fd sha256 /f `"$certificate`" /p `"$env:SIGNING_CERTIFICATE_PASSWORD`" /tr http://timestamp.digicert.com"
          vpk pack `
            --packId GptAccountKeeper.Desktop `
            --packVersion ${{ steps.version.outputs.version }} `
            --packTitle 'ChatGPT Account Keeper' `
            --packAuthors 'yang-sanmu' `
            --packDir artifacts/stage `
            --mainExe GptAccountKeeper.Desktop.exe `
            --icon desktop/src/GptAccountKeeper.Desktop/app-icon.ico `
            --runtime win-x64 `
            --outputDir artifacts/Releases `
            --signParams $signParams

      - name: Create unsigned VeloPack package
        if: env.SIGNING_CERTIFICATE_BASE64 == ''
        run: >-
          vpk pack
          --packId GptAccountKeeper.Desktop
          --packVersion ${{ steps.version.outputs.version }}
          --packTitle "ChatGPT Account Keeper"
          --packAuthors "yang-sanmu"
          --packDir artifacts/stage
          --mainExe GptAccountKeeper.Desktop.exe
          --icon desktop/src/GptAccountKeeper.Desktop/app-icon.ico
          --runtime win-x64
          --outputDir artifacts/Releases

      - name: Verify Authenticode signatures
        if: env.SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $executables = Get-ChildItem artifacts/Releases -File -Filter '*.exe'
          if ($executables.Count -eq 0) { throw 'VeloPack produced no Windows executables' }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid signature on $($executable.Name): $($signature.Status)"
            }
          }

      # The SBOM lands in artifacts/compliance, not artifacts/Releases: `vpk upload github`
      # only publishes the files it recognises as VeloPack output, so anything extra left in
      # artifacts/Releases would silently never reach the Release.
      - name: Create compliance directory
        shell: pwsh
        run: New-Item -ItemType Directory artifacts/compliance -Force | Out-Null

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: artifacts/stage
          format: spdx-json
          output-file: artifacts/compliance/GptAccountKeeper.Desktop-${{ steps.version.outputs.version }}.spdx.json

      - name: Bundle corresponding source and release checksums
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $versions = Get-Content build/runtime-versions.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory artifacts/compliance -Force | Out-Null

          git archive --format=zip --output "artifacts/compliance/chatgpt-account-keeper-$version-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Project source archive generation failed' }

          $mihomoSource = "artifacts/compliance/mihomo-v$($versions.mihomo.version)-source.zip"
          Invoke-WebRequest `
            "https://github.com/MetaCubeX/mihomo/archive/refs/tags/v$($versions.mihomo.version).zip" `
            -OutFile $mihomoSource

          $releaseFiles = @(
            Get-ChildItem artifacts/Releases -File | Where-Object {
              $_.Name -in @('GptAccountKeeper.Desktop-win-Setup.exe', 'RELEASES', 'releases.win.json') -or
              $_.Name -like "*$version*"
            }
            Get-ChildItem artifacts/compliance -File
          ) | Sort-Object Name
          if ($releaseFiles.Count -eq 0) { throw 'No release files were available for checksums' }
          $checksumLines = $releaseFiles | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path artifacts/compliance) 'SHA256SUMS.release.txt'),
            $checksumLines,
            [Text.UTF8Encoding]::new($false))

      # Tag builds intentionally stop at the artifact. Publishing remains a manual action
      # until the installed N-1 -> N candidate has been exercised and explicitly attested.
      # Signing is not required: unsigned packages upload the same way.
      - name: Upload package assets to a GitHub draft
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_draft == true &&
          inputs.n_minus_one_verified == true
        run: >-
          vpk upload github
          --repoUrl https://github.com/yang-sanmu/chatgpt-account-keeper
          --token ${{ github.token }}
          --outputDir artifacts/Releases
          --tag v${{ steps.version.outputs.version }}
          --releaseName "ChatGPT Account Keeper ${{ steps.version.outputs.version }}"

      - name: Upload source and checksum assets to draft
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_draft == true &&
          inputs.n_minus_one_verified == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/compliance -File | Select-Object -ExpandProperty FullName
          if ($assets.Count -eq 0) { throw 'No compliance assets were generated' }
          gh release upload v${{ steps.version.outputs.version }} @assets `
            --repo ${{ github.repository }} `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Compliance asset upload failed' }

      - name: Report why release upload was withheld
        if: >-
          !(github.event_name == 'workflow_dispatch' &&
            inputs.publish_draft == true &&
            inputs.n_minus_one_verified == true)
        shell: pwsh
        run: Write-Host 'Candidate retained as a workflow artifact; GitHub Release upload requires publish_draft and an attested installed N-1 -> N run.'

      - uses: actions/upload-artifact@v4
        with:
          name: GptAccountKeeper.Desktop-win-x64-${{ steps.version.outputs.version }}
          path: |
            artifacts/Releases
            artifacts/compliance
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'keeper-signing.pfx'
          if (Test-Path -LiteralPath $certificate) {
            Remove-Item -LiteralPath $certificate -Force
          }
